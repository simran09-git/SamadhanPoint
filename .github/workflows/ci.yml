name: SamadhanPoint CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sp/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        run: mvn -B clean verify
      - name: Dependency vulnerability report
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=11
      - name: Frontend syntax check
        working-directory: sp/backend/src/main/resources/static
        run: node --check js/app.js
      - name: Compile Docker image
        working-directory: sp
        run: docker build -f Dockerfile -t samadhanpoint:ci .
