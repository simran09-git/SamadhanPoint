services:
  postgres:
    image: postgres:16-alpine
    container_name: samadhanpoint-postgres
    environment:
      POSTGRES_DB: samadhanpoint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - samadhanpoint_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d samadhanpoint"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    container_name: samadhanpoint-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/samadhanpoint
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PORT: 8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
    ports:
      - "8080:8080"
volumes:
  samadhanpoint_pg:
